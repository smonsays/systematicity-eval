method: grid
name: mlc
parameters:
  config:
    values:
      - configs/mlc.py
  config.model.provider:
    value: gemini
  config.model.name:
    values:
      - gemini-3.1-flash-lite-preview
      - gemini-3-flash-preview
      - gemini-3.1-pro-preview
      - claude-opus-4.7
      - gpt-5.5
  config.model.n_attempts:
    values:
      - 5
  config.model.reasoning_effort:
    values:
      - low
      - medium
      - high
  config.dataset.vocabulary:
    values:
      - MLC
      - NUMBERS
      - LETTERS
  config.dataset.n_support:
    values:
      - 4
      - 8
  config.dataset.n_languages:
    values:
      - 10
  config.dataset.n_translation_per_language:
    values:
      - 4
  config.dataset.n_recomposition_per_language:
    values:
      - 4
  config.dataset.n_shuffle_per_language:
    values:
      - 4
  config.seed:
    values:
      - 1
  config.logger:
    value: wandb
program: run.py
command:
  - ${env}
  - uv
  - run
  - --env-file
  - .env
  - ${program}
  - ${args}
