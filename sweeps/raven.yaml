method: grid
name: raven
parameters:
  config:
    values:
      - configs/raven.py
  config.model.provider:
    value: gemini
  config.model.name:
    values:
      - gemini-3.1-flash-lite-preview
      - gemini-3-flash-preview
      - gemini-3.1-pro-preview
      - claude-opus-4.7
      - gpt-5.5
  config.model.n_attempts:
    values:
      - 5
  config.model.reasoning_effort:
    values:
      - low
      - medium
      - high
  config.dataset.n_sets:
    values:
      - 10
  config.dataset.n_permutations_per_set:
    values:
      - 5
  config.dataset.n_features:
    values:
      - 1
      - 2
      - 3
  config.dataset.feature_maxval:
    values:
      - 10
  config.seed:
    values:
      - 1
      - 2
      - 3
  config.logger:
    value: wandb
program: run.py
command:
  - ${env}
  - uv
  - run
  - --env-file
  - .env
  - ${program}
  - ${args}
