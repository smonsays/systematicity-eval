[project]
name = "systematicity-eval"
version = "0.1.0"
description = "Official code for the paper 'Thought without systematicity? Evaluating reasoning models on rule induction tasks'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "any-llm-sdk[anthropic,gemini,openai]>=1.13.0",
    "backoff>=2.2.1",
    "chex>=0.1.89",
    "einops>=0.8.1",
    "flax>=0.10.6",
    "jax[cpu]>=0.6.1",
    "jaxtyping>=0.3.2",
    "ml-collections>=1.1.0",
    "pandas>=2.3.0",
    "plotly>=6.6.0",
    "wandb>=0.20.1",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 90
indent-width = 2

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "ANN", # flake8 type annotations
    "RUF", # ruff-specific rules
    # "D",   # pydocstyle
]
fixable = ["ALL"]
# Add the `line-too-long` rule to the enforced rule set.
extend-select = ["E501"]
ignore = ["B023", "F722"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true

[dependency-groups]
dev = [
    "ty>=0.0.1a19",
]
